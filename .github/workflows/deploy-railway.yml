name: 🚀 Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔔 Trigger Railway Deploy
        run: |
          echo "🚀 Triggering Railway deployment..."
          HTTP=$(curl -s -o res.json -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}")
          echo "HTTP: $HTTP"
          cat res.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "202" ]; then
            echo "❌ Deploy hook failed with status $HTTP"
            exit 1
          fi
          echo "✅ Deploy triggered!"

      - name: ⏳ Verify new code is live (poll deploy-test)
        run: |
          echo "Polling /api/deploy-test until new build is live (max 15 min)..."
          for i in $(seq 1 30); do
            sleep 30
            HTTP=$(curl -s -o out.json -w "%{http_code}" \
              "https://twenty2crm-production-7997.up.railway.app/api/deploy-test")
            echo "Attempt $i: HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              cat out.json
              echo ""
              echo "✅ New build is live!"
              exit 0
            fi
          done
          echo "❌ New build did not become live within 15 minutes"
          exit 1
